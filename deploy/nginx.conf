# Hai cổng vào, hai mặt phẳng.
#
# Website khách ở cổng 80, hệ thống quản trị ở cổng 8080. Cách này tách hẳn hai
# đối tượng dùng: người ngoài không có đường nào chạm tới màn hình nội bộ, kể cả
# khi họ đoán đúng đường dẫn.
#
# Vì sao không gộp thành một cổng với `/admin` trỏ sang app kia: cả hai app Next
# đều phục vụ tài nguyên tĩnh của mình ở `/_next/*`. Đặt chung một cổng thì hai
# vùng đường dẫn đó chồng lên nhau, và app nào khớp trước sẽ nuốt CSS của app kia.
# Đổi `basePath` để tránh thì phải sửa mọi liên kết trong cả hai app.

upstream website {
    server website:3100;
}

upstream quan_tri {
    server admin:3101;
}

# Next dùng WebSocket cho một số tính năng. Không có hai dòng map này thì kết nối
# nâng cấp giao thức bị nginx hạ xuống HTTP thường và im lặng hỏng.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Ứng viên gửi CV. Mặc định của nginx là 1MB, trong khi backend nhận tới
    # MAX_UPLOAD_MB. Để nguyên thì file 3MB bị nginx chặn bằng 413 trước khi tới
    # backend, và thông báo lỗi là trang mặc định của nginx chứ không phải câu
    # tiếng Việt của hệ thống.
    client_max_body_size 20m;

    location / {
        proxy_pass http://website;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://quan_tri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
